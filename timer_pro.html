
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таймер и Секундомер</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
            transition: background 0.5s ease;
        }

        /* Смена фона для секундомера */
        body.stopwatch-mode {
            background: linear-gradient(135deg, #134e5e 0%, #71b280 100%);
        }

        .app-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            text-align: center;
            width: 100%;
            max-width: 450px;
        }

        /* --- ВКЛАДКИ --- */
        .mode-tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 25px;
            position: relative;
        }
        .mode-tab {
            flex: 1;
            padding: 10px;
            cursor: pointer;
            font-weight: 600;
            color: rgba(255,255,255,0.6);
            transition: color 0.3s;
            z-index: 1;
        }
        .mode-tab.active { color: white; }
        .tab-bg {
            position: absolute;
            top: 5px; left: 5px;
            width: calc(50% - 5px); height: calc(100% - 10px);
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* --- НАСТРОЙКА ВРЕМЕНИ --- */
        .time-setup {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 12px;
        }
        .time-setup.hidden { display: none; }
        
        .time-setup input {
            width: 60px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            font-size: 20px;
            text-align: center;
            border-radius: 8px;
            padding: 5px;
            font-family: 'Montserrat', sans-serif;
            outline: none;
        }
        .time-setup input:focus { border-color: white; }
        .time-setup span { font-size: 20px; font-weight: bold; }

        /* --- ТАЙМЕР --- */
        .timer-container {
            position: relative;
            width: 260px;
            height: 260px;
            margin: 0 auto 30px;
        }

        .progress-ring-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
        }

        .progress-ring-fill {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border-radius: 50%;
            background: conic-gradient(#fff 0deg, rgba(255,255,255,0.1) 0deg);
            transition: background 0.1s linear;
            /* Вырезаем центр, чтобы получилось кольцо */
            mask: radial-gradient(transparent 68%, black 69%);
            -webkit-mask: radial-gradient(transparent 68%, black 69%);
        }

        .time-display {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 52px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        /* --- КНОПКИ --- */
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            flex: 1;
        }
        button:hover { background: rgba(255, 255, 255, 0.3); transform: translateY(-2px); }
        button:active { transform: translateY(0); }
        button.primary { background: #fff; color: #1e3c72; }
        button.primary:hover { background: #e0e0e0; }
        body.stopwatch-mode button.primary { color: #134e5e; }
        
        /* Кнопка сброса */
        button.reset { flex: 0.5; background: rgba(255, 82, 82, 0.4); }
        button.reset:hover { background: rgba(255, 82, 82, 0.6); }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Вкладки -->
        <div class="mode-tabs">
            <div class="tab-bg" id="tabBg"></div>
            <div class="mode-tab active" onclick="switchMode(0)">Таймер</div>
            <div class="mode-tab" onclick="switchMode(1)">Секундомер</div>
        </div>

        <!-- Настройка времени (только для таймера) -->
        <div class="time-setup" id="timeSetup">
            <input type="number" id="inputHours" value="0" min="0" max="23">
            <span>:</span>
            <input type="number" id="inputMinutes" value="25" min="0" max="59">
            <span>:</span>
            <input type="number" id="inputSeconds" value="0" min="0" max="59">
            <button onclick="setTimeFromInputs()" style="flex: 0.3; padding: 5px; font-size: 12px;">OK</button>
        </div>

        <!-- Круг с временем -->
        <div class="timer-container">
            <div class="progress-ring-bg"></div>
            <div class="progress-ring-fill" id="progressRing"></div>
            <div class="time-display" id="timeDisplay">25:00</div>
        </div>

        <!-- Кнопки -->
        <div class="controls">
            <button class="primary" id="startBtn" onclick="toggleStart()">Старт</button>
            <button class="reset" id="resetBtn" onclick="resetTimer()">Сброс</button>
        </div>
    </div>

    <script>
        // --- ПЕРЕМЕННЫЕ ---
        let currentMode = 0; // 0 - Таймер, 1 - Секундомер
        let isRunning = false;
        let timerId = null;

        // Для таймера (обратный отсчет)
        let timeLeft = 25 * 60; // в секундах
        let totalTime = 25 * 60; // для прогресс-бара

        // Для секундомера (прямой отсчет)
        let stopwatchTime = 0; // в секундах

        // Элементы
        const timeDisplay = document.getElementById('timeDisplay');
        const progressRing = document.getElementById('progressRing');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const timeSetup = document.getElementById('timeSetup');
        const tabBg = document.getElementById('tabBg');
        const modeTabs = document.querySelectorAll('.mode-tab');

        const inputHours = document.getElementById('inputHours');
        const inputMinutes = document.getElementById('inputMinutes');
        const inputSeconds = document.getElementById('inputSeconds');

        // --- ПЕРЕКЛЮЧЕНИЕ РЕЖИМОВ ---
        function switchMode(mode) {
            if (isRunning) pause(); // Останавливаем при переключении
            
            currentMode = mode;
            
            // Анимация вкладок
            tabBg.style.transform = `translateX(${mode * 100}%)`;
            modeTabs.forEach((tab, i) => tab.classList.toggle('active', i === mode));

            if (mode === 0) {
                // РЕЖИМ ТАЙМЕРА
                document.body.classList.remove('stopwatch-mode');
                timeSetup.classList.remove('hidden');
                timeLeft = totalTime; // Восстанавливаем время
                updateTimerDisplay();
            } else {
                // РЕЖИМ СЕКУНДОМЕРА
                document.body.classList.add('stopwatch-mode');
                timeSetup.classList.add('hidden');
                stopwatchTime = 0;
                updateStopwatchDisplay();
            }
            
            resetProgressBar();
        }

        // --- ЛОГИКА ТАЙМЕРА ---
        function setTimeFromInputs() {
            let h = parseInt(inputHours.value) || 0;
            let m = parseInt(inputMinutes.value) || 0;
            let s = parseInt(inputSeconds.value) || 0;

            // Ограничиваем значения
            if (h < 0) h = 0;
            if (m < 0) m = 0; if (m > 59) m = 59;
            if (s < 0) s = 0; if (s > 59) s = 59;

            inputHours.value = h;
            inputMinutes.value = m;
            inputSeconds.value = s;

            totalTime = h * 3600 + m * 60 + s;
            
            if (totalTime === 0) {
                alert("Время должно быть больше нуля!");
                totalTime = 25 * 60;
                inputMinutes.value = 25;
            }

            timeLeft = totalTime;
            pause();
            updateTimerDisplay();
            resetProgressBar();
        }

        function updateTimerDisplay() {
            const h = Math.floor(timeLeft / 3600);
            const m = Math.floor((timeLeft % 3600) / 60);
            const s = timeLeft % 60;
            
            if (h > 0) {
                timeDisplay.textContent = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            } else {
                timeDisplay.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            }
            document.title = `${timeDisplay.textContent} - Таймер`;
        }

        function updateProgressBar() {
            if (totalTime === 0) return;
            const progress = (totalTime - timeLeft) / totalTime;
            const degrees = progress * 360;
            progressRing.style.background = `conic-gradient(#fff ${degrees}deg, rgba(255,255,255,0.1) ${degrees}deg)`;
        }

        // --- ЛОГИКА СЕКУНДОМЕРА ---
        function updateStopwatchDisplay() {
            const h = Math.floor(stopwatchTime / 3600);
            const m = Math.floor((stopwatchTime % 3600) / 60);
            const s = stopwatchTime % 60;
            
            if (h > 0) {
                timeDisplay.textContent = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            } else {
                timeDisplay.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            }
            document.title = `${timeDisplay.textContent} - Секундомер`;
        }

        function updateStopwatchRing() {
            // Для секундомера круг заполняется по кругу каждую минуту
            const secondsInMinute = stopwatchTime % 60;
            const degrees = (secondsInMinute / 60) * 360;
            progressRing.style.background = `conic-gradient(#fff ${degrees}deg, rgba(255,255,255,0.1) ${degrees}deg)`;
        }

        // --- ОБЩИЕ ФУНКЦИИ ---
        function toggleStart() {
            if (isRunning) {
                pause();
            } else {
                play();
            }
        }

        function play() {
            isRunning = true;
            startBtn.textContent = 'Пауза';
            
            if (currentMode === 0) {
                // Таймер
                if (timeLeft === 0) {
                    resetTimer();
                    return;
                }
                timerId = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateTimerDisplay();
                        updateProgressBar();
                    } else {
                        pause();
                        playSound(); // Звук окончания
                        timeDisplay.textContent = "00:00";
                        progressRing.style.background = `conic-gradient(#fff 360deg, rgba(255,255,255,0.1) 360deg)`;
                    }
                }, 1000);
            } else {
                // Секундомер
                timerId = setInterval(() => {
                    stopwatchTime++;
                    updateStopwatchDisplay();
                    updateStopwatchRing();
                }, 1000);
            }
        }

        function pause() {
            isRunning = false;
            clearInterval(timerId);
            startBtn.textContent = 'Старт';
        }

        function resetTimer() {
            pause();
            if (currentMode === 0) {
                timeLeft = totalTime;
                updateTimerDisplay();
                resetProgressBar();
            } else {
                stopwatchTime = 0;
                updateStopwatchDisplay();
                resetProgressBar();
            }
            document.title = "Таймер";
        }

        function resetProgressBar() {
            progressRing.style.background = `conic-gradient(#fff 0deg, rgba(255,255,255,0.1) 0deg)`;
        }

        // --- ЗВУК (WEB AUDIO API) ---
        function playSound() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            // Играем три ноты (как в будильнике)
            const notes = [880, 1100, 1320];
            notes.forEach((freq, index) => {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                }, index * 200);
            });
        }

        // Инициализация
        setTimeFromInputs();
        updateTimerDisplay();
    </script>
</body>
</html>
