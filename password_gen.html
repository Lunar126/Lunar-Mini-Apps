<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор паролей</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border: 1px solid #334155;
        }

        h1 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 20px;
            color: #f1f5f9;
        }

        /* --- БЛОК С ПАРОЛЕМ --- */
        .password-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            position: relative;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        .password-box:hover { border-color: #64748b; }

        .password-text {
            font-family: 'Courier New', monospace;
            font-size: 18px;
            font-weight: bold;
            color: #38bdf8;
            letter-spacing: 1px;
            word-break: break-all;
        }

        .copy-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 20px;
            transition: color 0.3s;
            padding: 5px;
            flex-shrink: 0;
        }
        .copy-btn:hover { color: #fff; }

        .tooltip {
            position: absolute;
            top: -30px; left: 50%;
            transform: translateX(-50%);
            background: #10b981;
            color: white;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s, top 0.3s;
            pointer-events: none;
        }
        .tooltip.show { opacity: 1; top: -35px; }

        /* --- ПОЛЗУНОК --- */
        .length-control { margin-bottom: 20px; }
        .length-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
        .length-value { font-weight: bold; color: #38bdf8; font-size: 16px; }

        input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            background: transparent;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            height: 6px; background: #334155; border-radius: 3px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px; width: 20px; border-radius: 50%;
            background: #38bdf8; margin-top: -7px;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
            transition: transform 0.1s;
        }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

        /* --- ИНДИКАТОР НАДЕЖНОСТИ --- */
        .strength-meter { margin-bottom: 25px; }
        .strength-bar {
            height: 6px; background: #334155; border-radius: 3px;
            overflow: hidden; margin-bottom: 5px;
        }
        .strength-fill {
            height: 100%; width: 0%;
            background: #ef4444;
            transition: width 0.4s ease, background-color 0.4s ease;
        }
        .strength-text {
            font-size: 12px; text-align: right; color: #94a3b8;
            font-weight: 600; transition: color 0.3s;
        }

        /* --- ЧЕКБОКСЫ --- */
        .options {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 12px; margin-bottom: 25px;
        }
        .option-item {
            display: flex; align-items: center; gap: 10px;
            font-size: 14px; cursor: pointer; color: #cbd5e1;
            transition: color 0.2s;
        }
        .option-item:hover { color: #fff; }

        .option-item input[type="checkbox"] {
            appearance: none; width: 18px; height: 18px;
            border: 2px solid #475569; border-radius: 4px;
            cursor: pointer; position: relative; transition: all 0.2s;
            flex-shrink: 0;
        }
        .option-item input[type="checkbox"]:checked {
            background: #38bdf8; border-color: #38bdf8;
        }
        .option-item input[type="checkbox"]:checked::after {
            content: '✓'; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); color: #0f172a;
            font-size: 12px; font-weight: bold;
        }

        /* --- КНОПКА --- */
        .generate-btn {
            width: 100%; padding: 15px;
            background: linear-gradient(135deg, #38bdf8 0%, #3b82f6 100%);
            border: none; border-radius: 12px; color: white;
            font-size: 16px; font-weight: bold; cursor: pointer;
            transition: all 0.3s; font-family: 'Montserrat', sans-serif;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }
        .generate-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4); }
        .generate-btn:active { transform: translateY(0); }
    </style>
</head>
<body>

    <div class="container">
        <h1>Генератор паролей</h1>

        <div class="password-box" onclick="copyPassword()">
            <span class="password-text" id="passwordDisplay">Нажмите "Сгенерировать"</span>
            <button class="copy-btn" title="Копировать">📋</button>
            <div class="tooltip" id="tooltip">Скопировано!</div>
        </div>

        <div class="length-control">
            <div class="length-header">
                <span>Длина пароля</span>
                <span class="length-value" id="lengthValue">16</span>
            </div>
            <input type="range" id="lengthSlider" min="4" max="32" value="16">
        </div>

        <div class="strength-meter">
            <div class="strength-bar">
                <div class="strength-fill" id="strengthFill"></div>
            </div>
            <div class="strength-text" id="strengthText">Ожидание...</div>
        </div>

        <div class="options">
            <label class="option-item">
                <input type="checkbox" id="useUppercase" checked>
                Заглавные (A-Z)
            </label>
            <label class="option-item">
                <input type="checkbox" id="useLowercase" checked>
                Строчные (a-z)
            </label>
            <label class="option-item">
                <input type="checkbox" id="useNumbers" checked>
                Цифры (0-9)
            </label>
            <label class="option-item">
                <input type="checkbox" id="useSymbols" checked>
                Символы (!@#$)
            </label>
        </div>

        <button class="generate-btn" onclick="generatePassword()">Сгенерировать пароль</button>
    </div>

    <script>
        const passwordDisplay = document.getElementById('passwordDisplay');
        const lengthSlider = document.getElementById('lengthSlider');
        const lengthValue = document.getElementById('lengthValue');
        const strengthFill = document.getElementById('strengthFill');
        const strengthText = document.getElementById('strengthText');
        const tooltip = document.getElementById('tooltip');

        const useUppercase = document.getElementById('useUppercase');
        const useLowercase = document.getElementById('useLowercase');
        const useNumbers = document.getElementById('useNumbers');
        const useSymbols = document.getElementById('useSymbols');

        const chars = {
            upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
            lower: 'abcdefghijklmnopqrstuvwxyz',
            numbers: '0123456789',
            symbols: '!@#$%^&*()_+~`|}{[]:;?><,./-='
        };

        lengthSlider.addEventListener('input', (e) => {
            lengthValue.textContent = e.target.value;
        });

        function generatePassword() {
            let length = parseInt(lengthSlider.value);
            let availableChars = '';
            let password = '';

            if (useUppercase.checked) availableChars += chars.upper;
            if (useLowercase.checked) availableChars += chars.lower;
            if (useNumbers.checked) availableChars += chars.numbers;
            if (useSymbols.checked) availableChars += chars.symbols;

            if (availableChars === '') {
                passwordDisplay.textContent = "Выберите хотя бы один тип!";
                passwordDisplay.style.color = "#ef4444";
                strengthFill.style.width = '0%';
                strengthText.textContent = 'Нет пароля';
                strengthText.style.color = '#ef4444';
                return;
            }

            for (let i = 0; i < length; i++) {
                const randomIndex = Math.floor(Math.random() * availableChars.length);
                password += availableChars[randomIndex];
            }

            passwordDisplay.textContent = password;
            passwordDisplay.style.color = "#38bdf8"; // Вернули цвет текста

            // Оцениваем надежность
            evaluateStrength(password, availableChars.length);
        }

        function evaluateStrength(password, charsetSize) {
            let strength = 0;
            const len = password.length;

            // НОВАЯ ЛОГИКА: если длина меньше 8, пароль считается коротким и опасным
            if (len < 8) {
                strengthFill.style.width = '20%'; // Полоска короткая
                strengthFill.style.backgroundColor = '#ef4444'; // Красный
                strengthText.textContent = 'Короткий пароль (Опасно!)';
                strengthText.style.color = '#ef4444'; // Текст красный
                return; // Выходим, не считая дальше
            }

            // Дальнейшая оценка по длине и разнообразию
            if (len > 8) strength += 20;
            if (len > 12) strength += 20;
            if (len > 16) strength += 10;

            if (charsetSize > 26) strength += 15;
            if (charsetSize > 52) strength += 15;
            if (charsetSize > 62) strength += 20;

            if (strength > 100) strength = 100;

            strengthFill.style.width = `${strength}%`;

            if (strength < 75) {
                strengthFill.style.backgroundColor = '#f59e0b'; // Оранжевый
                strengthText.textContent = 'Средний пароль';
                strengthText.style.color = '#f59e0b';
            } else {
                strengthFill.style.backgroundColor = '#10b981'; // Зеленый
                strengthText.textContent = 'Надежный пароль';
                strengthText.style.color = '#10b981';
            }
        }

        function copyPassword() {
            const text = passwordDisplay.textContent;
            if (text === 'Нажмите "Сгенерировать"' || text === 'Выберите хотя бы один тип!') return;

            navigator.clipboard.writeText(text).then(() => {
                tooltip.classList.add('show');
                setTimeout(() => tooltip.classList.remove('show'), 1500);
            });
        }

        // Генерируем пароль при загрузке
        generatePassword();
    </script>
</body>
</html>
